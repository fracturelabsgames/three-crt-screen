<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>three-crt-screen demo</title>
<style>
  html,body{margin:0;height:100%;background:#07070c;color:#ddd;font:13px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #hint{position:fixed;left:12px;bottom:12px;padding:8px 10px;background:rgba(0,0,0,.6);border-radius:4px;max-width:420px}
  #hint b{color:#fff}
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hint"><b>three-crt-screen</b> · drop an image or video on the page (or use "load file" in the panel) · drag to orbit · pick a preset, then tweak any parameter · framing sets how the picture fits the screen</div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';
import { createCRTMaterial, updateCRT, setCRT, CRT_PARAMS, CRT_PRESETS, CRT_DEFAULTS } from '../src/crt-screen.js';

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07070c);
const camera = new THREE.PerspectiveCamera(40, 1, .1, 100); camera.position.set(0, 0, 3.2);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;

// test card: colour bars, gradient, grid and text, animated so motion artefacts show
const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360; const g = cv.getContext('2d');
const card = new THREE.CanvasTexture(cv); card.colorSpace = THREE.SRGBColorSpace;
function drawCard(t) {
  const W = cv.width, H = cv.height, bars = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];
  bars.forEach((c, i) => { g.fillStyle = c; g.fillRect(i * W / 7, 0, W / 7 + 1, H * .62); });
  const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, '#000'); gr.addColorStop(1, '#fff'); g.fillStyle = gr; g.fillRect(0, H * .62, W, H * .1);
  g.fillStyle = '#101018'; g.fillRect(0, H * .72, W, H * .28);
  g.strokeStyle = '#ff2a3d'; g.lineWidth = 3; g.beginPath(); g.arc(W / 2, H * .45, H * .3, 0, 7); g.stroke();
  g.fillStyle = '#fff'; g.font = 'bold 44px system-ui'; g.textAlign = 'center'; g.fillText('CRT SCREEN', W / 2, H * .9);
  const x = (Math.sin(t) * .5 + .5) * (W - 60); g.fillStyle = '#38e8ff'; g.fillRect(x, H * .74, 60, 18);
  card.needsUpdate = true;
}
drawCard(0);

const params = Object.assign({}, CRT_DEFAULTS, CRT_PRESETS.crtTV);
const mat = createCRTMaterial(THREE, Object.assign({ map: card, mapAspect: 16 / 9, fog: false }, params));
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); scene.add(screen);
// a dark bezel so curvature and corners read
const bez = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x15151c })); bez.position.z = -.01; scene.add(bez);
// screen shape: a fixed aspect, or 'match picture' (follows the loaded image / video)
const SHAPES = { 'match picture': 0, '16:9': 16 / 9, '4:3': 4 / 3, '21:9': 21 / 9, '1:1': 1, '3:4 portrait': 3 / 4, '9:16 portrait': 9 / 16 };
let shapeAspect = -1;
function setShape(a) { if (Math.abs(a - shapeAspect) < 1e-4) return; shapeAspect = a; const h = a >= 1 ? 1.6 / Math.max(1, a / 1.9) : 1.8, w = h * a;
  screen.scale.set(w, h, 1); bez.scale.set(w + .2, h + .2, 1); mat.uniforms.uQuadAspect.value = a; }
let usingCard = true;

// load any image / video
function loadFile(f) {
  const url = URL.createObjectURL(f);
  if (f.type.startsWith('video')) { const v = document.createElement('video'); v.src = url; v.loop = true; v.muted = true; v.playsInline = true; v.play(); const t = new THREE.VideoTexture(v); t.colorSpace = THREE.SRGBColorSpace; setCRT(mat, { map: t }); }
  else new THREE.TextureLoader().load(url, t => { t.colorSpace = THREE.SRGBColorSpace; setCRT(mat, { map: t }); });
  usingCard = false;
}
addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
document.getElementById('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));

// GUI: presets + every parameter, grouped
const gui = new GUI({ title: 'CRT screen' });
const ui = { screen: '16:9', preset: 'crtTV', 'load file': () => document.getElementById('file').click(), 'copy settings': () => navigator.clipboard.writeText(JSON.stringify(params, null, 2)), 'test card': () => { setCRT(mat, { map: card }); mat.uniforms.uMapAspect.value = 16 / 9; usingCard = true; } };
gui.add(ui, 'preset', Object.keys(CRT_PRESETS)).onChange(p => { Object.assign(params, CRT_DEFAULTS, CRT_PRESETS[p]); setCRT(mat, params); gui.controllersRecursive().forEach(c => c.updateDisplay()); });
gui.add(ui, 'screen', Object.keys(SHAPES)).name('screen shape');
gui.add(ui, 'load file'); gui.add(ui, 'test card'); gui.add(ui, 'copy settings');
const folders = {};
for (const [k, , min, max, grp, desc] of CRT_PARAMS) {
  const f = folders[grp] || (folders[grp] = gui.addFolder(grp)); f.close();
  const opts = { fit: { cover: 0, contain: 1, stretch: 2, 'fit width': 3 }, maskType: { none: 0, 'aperture grille': 1, 'shadow mask': 2, 'LED dots': 3 }, flipX: { off: 0, on: 1 }, flipY: { off: 0, on: 1 } }[k];
  const c = (opts ? f.add(params, k, opts) : f.add(params, k, min, max, (max - min) / 400)).onChange(v => setCRT(mat, { [k]: +v })); c.domElement.title = desc;
}
folders.framing.open();

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const t = clock.getElapsedTime(); setShape(SHAPES[ui.screen] || mat.uniforms.uMapAspect.value); if (usingCard) drawCard(t); updateCRT(mat, t); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
